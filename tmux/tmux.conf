bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config Reloaded!"

set -g default-command "exec fish"
set -g default-terminal "tmux-256color"
set-option -sa terminal-features ',xterm-256color:RGB'

set -g mouse on
set -g focus-events on
set -g set-clipboard on
set -g detach-on-destroy off

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g allow-passthrough on
set -as terminal-overrides ',foot:Tc:Sixel'

set -g input-buffer-size 5000000

set-option -g terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[ q'

set -g @normal_cursor "\e[2 q"
set -g @insert_cursor "\e[2 q"

bind R command-prompt -I "#{session_name}" "rename-session '%%'"

unbind C-b               # Unbind default prefix
set -g prefix C-Space    # Set CTRL+SPACE as prefix

bind -n M-a select-pane -L
bind -n M-s select-pane -D
bind -n M-w select-pane -U
bind -n M-d select-pane -R

bind -n M-0 select-window -t :0
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

unbind h
bind -n M-c new-window -c "#{pane_current_path}"
bind -n M-v split-window -h -c "#{pane_current_path}"

bind-key -n M-y new-window -n yazi "yazi"
bind-key -n M-x kill-pane

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'thewtex/tmux-mem-cpu-load'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @resurrect-save-shell-history 'on'

set -g status on
set -g status-position top
set -g status-interval 3
set -g status-justify left

set -g status-style "bg=default,fg=default"
set -g status-left-length 100
set -g status-right-length 100

set -g pane-border-style "fg=black"
set -g pane-active-border-style "fg=black"

set -g message-style "bg=default,fg=default"
set -g message-command-style "bg=default,fg=default"

set -g window-status-format "#[fg=brightblack,bg=default] #I = #W "
set -g window-status-current-format "#[fg=blue,bg=default] #I - #W "

set -g window-status-separator ""

set -g status-left "#[fg=green,bold]   #S #[fg=green]│ "

set -g status-right "\
#[fg=green] #[fg=default]#{pane_current_path} "

set -g mode-style "bg=green,fg=default"

set -g clock-mode-colour "green"
set -g clock-mode-style 24

run '~/.tmux/plugins/tpm/tpm'
