bind=SUPER,Q,killclient
bind=SUPER,Tab,toggleoverview
bind=SUPER,Space,togglefloating
bind=SUPER,W,spawn_shell,~/.config/mango/scripts/toggle-waybar.sh
bind=SUPER+SHIFT,Tab,spawn_shell,~/.config/mango/scripts/wallpaper-picker.sh
bind=SUPER,Y,toggleglobal,

bind=SUPER,equal,spawn_shell,~/.config/mango/scripts/volume-control.sh up
bind=SUPER,minus,spawn_shell,~/.config/mango/scripts/volume-control.sh down
bind=SUPER+SHIFT,equal,spawn_shell,~/.config/mango/scripts/ext-brightness-control.sh up
bind=SUPER+SHIFT,minus,spawn_shell,~/.config/mango/scripts/ext-brightness-control.sh down
bind=SUPER,C,spawn_shell,~/.config/mango/scripts/picker.sh

bind=SUPER,T,spawn,foot
bind=SUPER+SHIFT,T,spawn,st
bind=SUPER,Return,spawn,wl-kbptr
bind=SUPER+SHIFT,Return,spawn,wl-kbptr -o modes=tile,bisect

bind=SUPER,D,spawn,fuzzel
bind=SUPER,B,spawn,firefox-devedition
bind=SUPER,E,spawn,emacs
bind=SUPER,A,spawn,foot yazi
bind=SUPER+SHIFT,A,spawn,dolphin

bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

bind=SUPER,H,focusdir,left
bind=SUPER,L,focusdir,right
bind=SUPER,K,focusdir,up
bind=SUPER,J,focusdir,down

bind=ALT,Tab,focusstack,next
bind=ALT+SHIFT,Tab,focusstack,prev

bind=SUPER+SHIFT,H,exchange_client,left
bind=SUPER+SHIFT,L,exchange_client,right
bind=SUPER+SHIFT,K,exchange_client,up
bind=SUPER+SHIFT,J,exchange_client,down

bind=SUPER+ALT,H,switch_proportion_preset
bind=SUPER+ALT,L,switch_proportion_preset

bind=SUPER,M,togglemaximizescreen
bind=SUPER+SHIFT,M,togglefullscreen

bind=SUPER+SHIFT,P,spawn_shell,~/.config/mango/scripts/screenshot.sh region clipboard freeze
bind=SUPER+ALT,P,spawn_shell,~/.config/mango/scripts/screenshot.sh fullscreen both
bind=SUPER,P,spawn_shell,~/.config/mango/scripts/screenshot.sh fullscreen clipboard
bind=SUPER+CTRL,P,spawn_shell,mango --output-folder $HOME/Pictures/Screenshots/ -m window -z
bind=SUPER,X,spawn_shell,~/.config/mango/scripts/screw.sh fullscreen compress 3

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

bind=SUPER+CTRL+SHIFT,Up,movewin,+0,-50
bind=SUPER+CTRL+SHIFT,Down,movewin,+0,+50
bind=SUPER+CTRL+SHIFT,Left,movewin,-50,+0
bind=SUPER+CTRL+SHIFT,Right,movewin,+50,+0

bind=SUPER+CTRL+SHIFT,K,movewin,+0,-50
bind=SUPER+CTRL+SHIFT,J,movewin,+0,+50
bind=SUPER+CTRL+SHIFT,H,movewin,-50,+0
bind=SUPER+CTRL+SHIFT,L,movewin,+50,+0

bind=CTRL+SUPER,K,resizewin,+0,-10%
bind=CTRL+SUPER,J,resizewin,+0,+10%
bind=CTRL+SUPER,H,resizewin,-10%,+0
bind=CTRL+SUPER,L,resizewin,+10%,+0
