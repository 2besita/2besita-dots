animations=1
layer_animations=1

# window open
animation_type_open=zoom
animation_duration_open=150
animation_curve_open=0.16,1.0,0.3,1.0
zoom_initial_ratio=0.7
zoom_end_ratio=1.0

# window close
animation_type_close=fade
animation_duration_close=120
animation_curve_close=0.16,1.0,0.3,1.0
animation_fade_out=1

# window movement
animation_duration_move=400
animation_curve_move=0.3,1.4,0.4,1.0

# workspace
animation_duration_tag=350
animation_curve_tag=0.34,1.4,0.4,1.0
tag_animation_direction=1
