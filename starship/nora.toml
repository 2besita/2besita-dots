"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
$c\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
$conda\
$time\
$cmd_duration\
 \n$username\
$character"""

[username]
show_always = true
style_user = "fg:purple"
format = '[ morres ]($style)'

[directory]
style = "fg:yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "fg:yellow"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "fg:yellow"
format = '[$all_status$ahead_behind ]($style)'

[nodejs]
symbol = ""
style = "fg:green"
format = '[ $symbol( $version) ]($style)'

[bun]
symbol = ""
style = "fg:green"
format = '[ $symbol( $version) ]($style)'

[c]
symbol = " "
style = "fg:green"
format = '[ $symbol( $version) ]($style)'

[rust]
symbol = ""
style = "fg:green"
format = '[ $symbol( $version) ]($style)'

[golang]
symbol = ""
style = "fg:green"
format = '[ $symbol( $version) ]($style)'

[php]
symbol = ""
style = "fg:green"
format = '[ $symbol( $version) ]($style)'

[java]
symbol = " "
style = "fg:green"
format = '[ $symbol( $version) ]($style)'

[kotlin]
symbol = ""
style = "fg:green"
format = '[ $symbol( $version) ]($style)'

[haskell]
symbol = ""
style = "fg:green"
format = '[ $symbol( $version) ]($style)'

[python]
symbol = ""
style = "fg:green"
format = '[ $symbol( $version)(\(#$virtualenv\)) ]($style)'

[conda]
symbol = "  "
style = "fg:cyan"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "fg:bright-green"
format = '[ $time ]($style)'

[cmd_duration]
show_milliseconds = true
format = "in $duration "
style = "fg:bright-black"
disabled = false

[character]
disabled = false
success_symbol = '[>](bold fg:blue)'
error_symbol = '[>](bold fg:red)'
vimcmd_symbol = '[<](bold fg:green)'
vimcmd_replace_one_symbol = '[<](bold fg:yellow)'
vimcmd_replace_symbol = '[<](bold fg:yellow)'
vimcmd_visual_symbol = '[<](bold fg:yellow)'
